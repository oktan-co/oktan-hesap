name: probe
on: {push: {branches: [probe]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd updater && npm install --no-audit --no-fund --omit=dev
      - run: mkdir -p out && cd updater && DRY_RUN=1 node update-prices.mjs > ../out/dry.txt 2>&1 || true
        env: {FIREBASE_SERVICE_ACCOUNT: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"}
      - run: |
          git config user.name probe; git config user.email probe@x
          git add -f out; git commit -qm probe-out2; git push -q origin HEAD:probe
