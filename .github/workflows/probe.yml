name: probe
on: {push: {branches: [probe]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out; U=https://www.aktifportfoy.com.tr/fonlarimiz/yatirim-fonlarimiz/idl
          curl -sL -A "Mozilla/5.0" "$U" -o out/page.html; echo "status $?" > out/info.txt
          grep -oE '(src|href)="[^"]+\.js[^"]*"' out/page.html | sort -u > out/scripts.txt || true
          i=0; for s in $(sed -E 's/^(src|href)="//;s/"$//' out/scripts.txt); do case $s in http*) u=$s;; //*) u=https:$s;; /*) u=https://www.aktifportfoy.com.tr$s;; *) u=https://www.aktifportfoy.com.tr/$s;; esac; i=$((i+1)); curl -sL "$u" -o out/js$i.js; echo "$i $u" >> out/jsmap.txt; done
          grep -ohE '["'"'"'`][^"'"'"'`]*(api|Api|API|fiyat|Fiyat|price|Price|fund|Fund|getir)[^"'"'"'`]*["'"'"'`]' out/js*.js out/page.html | sort -u | head -400 > out/endpoints.txt || true
          timeout 60 google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$U" > out/dom.html 2>/dev/null || true
          grep -oE 'Fon Fiyat[^<]{0,40}(<[^>]*>[^<]{0,40}){0,6}' out/dom.html | head -5 > out/price.txt || true
      - run: |
          git config user.name probe; git config user.email probe@x
          git add -f out; git commit -qm probe-out; git push -q origin HEAD:probe
