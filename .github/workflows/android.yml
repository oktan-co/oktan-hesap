name: Android uygulaması

# android/ klasörü değişince APK'yı derler ve "Android uygulaması" sürümüne yükler.
# İndirme linki: https://github.com/oktan-co/oktan-hesap/releases/download/android/OktanHesap.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK'yı derle
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          FSA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # İmza anahtarı: güncellemeler eskisinin üstüne kurulabilsin diye her derlemede aynı anahtar kullanılır.
          # Anahtar depoda şifreli durur (release.jks.enc); şifresi gizli FIREBASE_SERVICE_ACCOUNT ayarından türetilir.
          # İlk derlemede anahtar burada üretilir ve şifrelenip depoya kaydedilir.
          export KS_PASS=$(printf %s "$FSA" | sha256sum | cut -d' ' -f1)
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
          elif [ -z "$FSA" ]; then
            echo "::error title=Gizli ayar yok::FIREBASE_SERVICE_ACCOUNT bulunamadı"; exit 1
          elif [ -f release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS -in release.jks.enc -out release.jks
          else
            keytool -genkeypair -keystore release.jks -storetype PKCS12 -storepass oktan-apk -keypass oktan-apk \
              -alias oktan -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Oktan Hesap, O=oktan-co, C=TR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KS_PASS -in release.jks -out release.jks.enc
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi
          set +e
          gradle assembleRelease --no-daemon -Pvcode=${{ github.run_number }} > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|^e: |What went wrong|FAILURE|Could not|> " build.log | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Derleme hatası::$msg"
            exit 1
          fi

      - name: Yeni imza anahtarını (şifreli) depoya kaydet
        if: env.NEW_KEY == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/release.jks.enc
          git commit -m "Android imza anahtarı (şifreli) [skip ci]"
          git pull --rebase -q origin main && git push -q origin HEAD:main

      - name: Sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk OktanHesap.apk
          notes="Sürüm 1.${{ github.run_number }} · $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
          if gh release view android > /dev/null 2>&1; then
            gh release upload android OktanHesap.apk --clobber
            gh release edit android --notes "$notes"
          else
            gh release create android OktanHesap.apk --title "Oktan Hesap Android uygulaması" --notes "$notes" --latest
          fi
          echo "::notice title=APK hazır::Sürüm 1.${{ github.run_number }}"
