name: Saat (20 dakikada bir tetikleyici)
# GitHub'ın kendi zamanlayıcısı (schedule) bu depoda güvenilir çalışmadığı için
# bu iş kesintisiz döner: piyasa saatlerinde (Pzt–Cmt 09:00–22:40, İstanbul) her 20 dakikada
# fiyat güncellemesini, her gün 11:55'te son ödeme hatırlatmasını; son gün ödenmemiş ekstre için
# 21:00, 22:00, 23:00 ve 23:30'da akşam hatırlatmalarını başlatır.
# Bir çalıştırma en fazla ~5,5 saat sürer; bitmeden kendini yeniden başlatır.
# Zincir koparsa uygulama açıldığında ya da elle "Run workflow" ile yeniden başlar.
on:
  workflow_dispatch: {}
  schedule: [{cron: "7 5 * * *"}]
permissions: {actions: write, contents: read}
concurrency: {group: ticker, cancel-in-progress: false}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Döngü
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          dispatch() { curl -sS -o /dev/null -w "%{http_code} $1\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/$1/dispatches" -d "$2"; }
          start=$(date +%s); last=0; sent=" "
          while :; do
            now=$(date +%s)
            if [ $((now - start)) -ge 19800 ]; then dispatch ticker.yml '{"ref":"main"}'; break; fi
            dow=$(TZ=Europe/Istanbul date +%u); hm=$((10#$(TZ=Europe/Istanbul date +%H) * 60 + 10#$(TZ=Europe/Istanbul date +%M))); day=$(TZ=Europe/Istanbul date +%F)
            if [ "$dow" -le 6 ] && [ $hm -ge 540 ] && [ $hm -le 1360 ] && [ $((now - last)) -ge 1200 ]; then
              dispatch prices.yml '{"ref":"main"}'; last=$now
            fi
            for slot in 715:noon 1260:21:00 1320:22:00 1380:23:00 1410:23:30; do
              at=${slot%%:*}; name=${slot#*:}; key="$day/$name"
              if [ $hm -ge $at ] && [ $hm -le $((at + 15)) ] && [[ "$sent" != *" $key "* ]]; then
                if [ "$name" = noon ]; then body='{"ref":"main","inputs":{"deneme":"false"}}'; else body="{\"ref\":\"main\",\"inputs\":{\"deneme\":\"false\",\"saat\":\"$name\"}}"; fi
                dispatch reminders.yml "$body"; sent="$sent$key "
              fi
            done
            sleep 60
          done
