name: Günlük servet kaydı
# Her gün 23:00 (İstanbul) civarı çalışır (UTC 20:00); GitHub zamanlamayı geciktirebilir.
# Uygulamayı açmadığın günlerde de grafiğe o günün değerini yazar. Elle çalıştırınca "dry" açıksa yazmaz, sadece hesaplananı gösterir.
on:
  schedule: [{cron: "0 20 * * *"}]
  workflow_dispatch:
    inputs:
      dry:
        description: "Deneme: veritabanına yazma, sadece hesaplananı göster"
        type: boolean
        default: true
concurrency: {group: snapshot, cancel-in-progress: false}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: {run: {working-directory: updater}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-audit --no-fund --omit=dev
      - run: node snapshot.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry == 'true' && '1' || '' }}
